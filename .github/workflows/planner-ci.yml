name: CI/CD Planner Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/planner:latest
  RAILWAY_URL: https://planner4-production.up.railway.app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        run: mvn -B clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/${{ vars.POSTGRES_DB }}
          DB_USERNAME: ${{ vars.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Build Frontend
        run: |
          cd frontend  # если фронтенд в папке frontend, иначе просто npm run build
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ env.RAILWAY_URL }}

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Railway
        run: |
          curl -X POST https://api.railway.app/v2/deploy/${{ secrets.RAILWAY_SERVICE_ID }} \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "image": "${{ env.IMAGE_NAME }}",
              "serviceId": "${{ secrets.RAILWAY_SERVICE_ID }}"
            }'

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check Health
        run: |
          echo "Waiting for service to wake up..."
          sleep 60
          HEALTH_URL="${{ env.RAILWAY_URL }}/actuator/health"
          for i in {1..20}; do
            response=$(curl -s "$HEALTH_URL" || echo "failed")
            if echo "$response" | grep -q '"status":"UP"'; then
              echo "Success: Backend is UP"
              exit 0
            fi
            echo "Attempt $i: Service not ready yet, waiting..."
            sleep 15
          done
          echo "Healthcheck timed out"
          exit 1