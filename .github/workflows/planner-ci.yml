name: CI/CD Planner Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/planner:latest
  # Для Render обычно используется /health или /actuator/health
  APP_BASE_URL: https://твое-приложение.onrender.com

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важно для SonarCloud

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with JaCoCo
        run: mvn -B clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  sonar-analysis:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B sonar:sonar

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env:IMAGE_NAME }}

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        # Используем Deploy Hook от Render (самый простой способ)
        run: |
          curl -f ${{ secrets.RENDER_DEPLOY_HOOK }}

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check Health Endpoint
        run: |
          echo "Waiting for Render to spin up the instance..."
          sleep 90 # Render (особенно на бесплатном тарифе) просыпается долго
          
          HEALTH_URL="${{ env.APP_BASE_URL }}/actuator/health"
          
          for i in {1..20}; do
            response=$(curl -s "$HEALTH_URL")
            if echo "$response" | grep -q '"status":"UP"'; then
              echo "Application is UP and Healthy!"
              exit 0
            fi
            echo "Attempt $i: Application is still starting..."
            sleep 15
          done
          
          echo "Healthcheck failed!"
          exit 1