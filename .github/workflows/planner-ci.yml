name: CI/CD Planner Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/planner:latest
  APP_BASE_URL: https://planner-api-mwez.onrender.com

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${DB_USERNAME }
          POSTGRES_PASSWORD: ${DB_PASSWORD}
          POSTGRES_DB: ${POSTGRES_DB}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn -B clean verify

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Backend
        run: curl -f ${{ secrets.RENDER_BACKEND_HOOK }}

      - name: Deploy Frontend
        run: curl -f ${{ secrets.RENDER_FRONTEND_HOOK }}

  healthcheck:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check Health
        run: |
          echo "Waiting for services to wake up..."
          sleep 60
          HEALTH_URL="${{ env.APP_BASE_URL }}/actuator/health"
          for i in {1..20}; do
            response=$(curl -s "$HEALTH_URL" || echo "failed")
            if echo "$response" | grep -q '"status":"UP"'; then
              echo "Success: Backend is UP"
              exit 0
            fi
            sleep 15
          done
          echo "Healthcheck timed out"
          exit 1